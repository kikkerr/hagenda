name: Supabase wakker houden

# Twee keer per dag een kleine leesvraag naar de database, zodat het gratis
# Supabase-project nooit als "inactief" gepauzeerd wordt.
# Mislukt het (bv. omdat het project toch gepauzeerd is), dan stuurt GitHub
# je automatisch een mail.

on:
  schedule:
    - cron: "17 6 * * *"    # elke dag ± 07:17 Belgische tijd
    - cron: "47 17 * * *"   # elke dag ± 18:47 Belgische tijd
  workflow_dispatch:        # ook handmatig te starten via "Actions"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Database even aanspreken
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::De secrets SUPABASE_URL en/of SUPABASE_ANON_KEY ontbreken."
            exit 1
          fi
          for poging in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/households?select=id&limit=1")
            echo "Poging $poging: antwoord $code"
            if [ "$code" = "200" ]; then echo "Supabase is wakker."; exit 0; fi
            sleep 20
          done
          echo "::error::Supabase antwoordt niet (code $code). Kijk in het Supabase-dashboard of het project gepauzeerd is en klik dan op 'Resume project'."
          exit 1
