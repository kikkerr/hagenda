name: Android-apk bouwen

on:
  workflow_dispatch:        # handmatig starten via tabblad "Actions"
  push:
    branches: [main]
    paths: ["app/**", "capacitor.config.json", "package.json", ".github/workflows/build-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Supabase-gegevens invullen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            sed -i "s|supabaseUrl: \"\"|supabaseUrl: \"$SUPABASE_URL\"|" app/index.html
            sed -i "s|supabaseAnonKey: \"\"|supabaseAnonKey: \"$SUPABASE_ANON_KEY\"|" app/index.html
          else
            echo "::warning::Geen SUPABASE_URL-secret gevonden: de apk start in demomodus."
          fi

      # Altijd dezelfde ondertekening, zodat een nieuwe apk de oude gewoon bijwerkt
      - name: Vaste sleutel klaarzetten
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore; fi

      - name: Android-project maken
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Apk bouwen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Apk hernoemen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Hagenda-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Hagenda-apk-${{ github.run_number }}
          path: Hagenda-*.apk
          retention-days: 30
